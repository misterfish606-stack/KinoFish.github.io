  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b23;
      --card-bg-hover: #212530;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --text: #ffffff;
      --text-muted: #8c919e;
      --border: #282c37;
      --gold: #ffc107;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }

    header { background: rgba(15, 17, 23, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
    .header-container { max-width: 1400px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--text); }

    .search-box { flex: 1; max-width: 500px; position: relative; }
    .search-input { width: 100%; padding: 10px 16px 10px 40px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 14px; outline: none; transition: 0.2s; }
    .search-input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 16px; height: 16px; }

    main { max-width: 1400px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }

    .filters-section { background: var(--card-bg); padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
    .filter-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-label { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .filter-btn { padding: 6px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 15px; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: 0.2s; }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    
    .movie-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; position: relative; }
    .movie-card:hover { transform: translateY(-5px); background: var(--card-bg-hover); border-color: #383d4d; }
    
    .poster-wrapper { position: relative; aspect-ratio: 2/3; background: #202430; overflow: hidden; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge { position: absolute; top: 8px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-hot { left: 8px; background: var(--accent); color: #fff; }
    .badge-new { right: 8px; background: #2e7d32; color: #fff; }

    .movie-info { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
    .movie-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-meta { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }

    footer { background: var(--card-bg); border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 40px; }

    @media (max-width: 600px) {
      .movies-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .header-container { flex-direction: column; align-items: stretch; }
      .movie-title { font-size: 13px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="/" class="logo">🎬 <span>KinoHD</span></a>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск фильма или актера...">
      </div>
    </div>
  </header>

  <main>
    <section class="filters-section">
      <div class="filter-group">
        <span class="filter-label">Категории:</span>
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="hot">🔥 Популярное</button>
        <button class="filter-btn" data-filter="new">✨ Новинки</button>
      </div>
    </section>

    <div class="movies-grid" id="moviesGrid"></div>
  </main>

  <footer>
    <p>&copy; 2026 KinoHD. Все права защищены. Смотрите кино онлайн бесплатно.</p>
  </footer>

      },
      {

        actors: ["Пол Мескал", "Педро Паскаль", "Дензель Вашингтон"]
      },
      {

        file: "venom_3.html",

      },
      {
        title: "Субстанция",
        file: "the_substance.html",

        year: 2024,
        country: "Великобритания",

        isNew: false,
        desc: "Угасающая звезда принимает инновационный препарат, создающий ее более молодую и идеальную версию.",

      {

        desc: "Питер Паркер начинает новую главу жизни, сталкиваясь с новыми вызовами и врагами в Нью-Йорке.",
        img: "https://static.hdrezka.ac/i/2026/5/27/i055dc6db901dgd21d31c.jpg",
        actors: ["Том Холланд"]
      }
    ];

    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';
    let searchQuery = '';

    function renderMovies() {
      moviesGrid.innerHTML = '';
      
      const filtered = movies.filter(movie => {
        const matchesSearch = movie.title.toLowerCase().includes(searchQuery) || 
                              movie.actors.some(actor => actor.toLowerCase().includes(searchQuery));
        
        let matchesFilter = true;
        if (currentFilter === 'hot') matchesFilter = movie.hot;
        if (currentFilter === 'new') matchesFilter = movie.isNew;

        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        moviesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">Ничего не найдено</div>`;
        return;
      }

      filtered.forEach(movie => {
        const card = document.createElement('a');
        card.href = movie.file;
        card.className = 'movie-card';
        
        card.innerHTML = `
          <div class="poster-wrapper">
            <img class="poster-img" src="${movie.img}" alt="${movie.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450?text=Нет+обложки'">
            ${movie.hot ? '<span class="badge badge-hot">TOP</span>' : ''}
            ${movie.isNew ? '<span class="badge badge-new">NEW</span>' : ''}
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">
              <span>${movie.year}</span>
              <span>${movie.country}</span>
            </div>
          </div>
        `;
        moviesGrid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMovies();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderMovies();
      });
    });

    renderMovies();
  </script>
</body>
