<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Апокалипсис по-голливудски — Fish Cinema</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
<style>
:root{--gold:#c9a84c;--gold-light:#e8cc80;--gold-dim:#8a7040;--cream:#e8dcc8;--cream-dim:#c4aa88;--bg:#16120c;--bg2:#1e1810;--bg3:#262014;--red:#7a2020;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--cream);min-height:100vh;}
.page-content{max-width:1100px;margin:0 auto;padding:50px;}

/* Плеер */
.player-wrapper{position:relative;padding-bottom:56.25%;height:0;background:#000;border:2px solid var(--gold-dim);}
.video-js{position:absolute;top:0;left:0;width:100%;height:100%;}
.video-js .vjs-big-play-button{background:rgba(43,182,204,0.9);border:none;border-radius:12px;width:80px;height:80px;line-height:80px;font-size:30px;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;}
.video-js .vjs-control-bar{background:rgba(10,10,10,0.95);height:50px;}
.video-js .vjs-progress-control{top:-8px;}
.video-js .vjs-play-progress{background:#2bb6cc;}
.video-js .vjs-volume-panel .vjs-volume-control{display:block;}

/* Табы источников */
.source-tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid var(--gold-dim);padding-bottom:10px;}
.source-tab{background:none;border:1px solid var(--gold-dim);color:var(--cream);padding:10px 20px;font-family:'Bebas Neue',sans-serif;cursor:pointer;transition:0.2s;}
.source-tab.active{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.source-tab:hover:not(.active){border-color:var(--gold);}

.source-panel{display:none;}
.source-panel.active{display:block;}

.input-group{margin:15px 0;}
.input-group label{display:block;color:var(--gold-dim);font-size:0.85rem;margin-bottom:5px;}
.input-group input{width:100%;padding:12px;background:var(--bg2);border:1px solid var(--gold-dim);color:var(--cream);font-size:1rem;}
.input-group button{background:var(--gold);color:var(--bg);border:none;padding:12px 24px;font-family:'Bebas Neue',sans-serif;font-size:1rem;cursor:pointer;margin-top:10px;}
.input-group button:hover{background:var(--gold-light);}

.status-box{margin-top:15px;padding:15px;background:rgba(30,24,16,0.7);border-left:3px solid var(--gold);font-size:0.9rem;}
.status-box.error{border-color:var(--red);background:rgba(122,32,32,0.2);}
.status-box.success{border-color:#27ae60;}

.torrent-stats{font-family:monospace;font-size:0.8rem;color:var(--cream-dim);margin-top:10px;}
</style>
</head>
<body>

<div class="page-content">
  <h2 style="font-family:'Playfair Display',serif;color:var(--gold);margin-bottom:20px;">✦ Смотреть онлайн ✦</h2>
  
  <div class="source-tabs">
    <button class="source-tab active" onclick="switchTab('direct')">Прямая ссылка (MP4)</button>
    <button class="source-tab" onclick="switchTab('torrent')">WebTorrent</button>
  </div>

  <!-- Прямая ссылка -->
  <div class="source-panel active" id="directPanel">
    <div class="input-group">
      <label>Ссылка на видео (MP4, WebM):</label>
      <input type="text" id="directUrl" placeholder="https://example.com/video.mp4" 
        value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
      <button onclick="loadDirect()">▶ Воспроизвести</button>
    </div>
    <div class="player-wrapper" style="margin-top:20px;">
      <video id="directPlayer" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="100%">
        <p class="vjs-no-js">JavaScript отключен</p>
      </video>
    </div>
  </div>

  <!-- Торрент -->
  <div class="source-panel" id="torrentPanel">
    <div class="input-group">
      <label>Magnet ссылка:</label>
      <input type="text" id="magnetUrl" placeholder="magnet:?xt=urn:btih:..." 
        value="magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=udp%3A%2F%2Ftracker.openbittorrent.com%3A80&tr=udp%3A%2F%2Ftracker.publicbt.com%3A80&tr=udp%3A%2F%2Ftracker.istole.it%3A6969&tr=udp%3A%2F%2Ftracker.ccc.de%3A80&tr=udp%3A%2F%2Fopen.demonii.com%3A1337">
      <button onclick="loadTorrent()">▶ Загрузить торрент</button>
    </div>
    <div id="torrentStatus" class="status-box" style="display:none;"></div>
    <div class="player-wrapper" style="margin-top:20px;">
      <video id="torrentPlayer" class="video-js vjs-default-skin" controls preload="auto" width="100%" height="100%"></video>
    </div>
  </div>
</div>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>

<script>
let directPlayer = null;
let torrentPlayer = null;
let client = null;

// Инициализация прямого плеера
function initDirectPlayer() {
  directPlayer = videojs('directPlayer', {
    html5: {
      vhs: {
        overrideNative: true,
        limitRenditionByPlayerDimensions: true
      }
    }
  });
  
  // Загружаем тестовое видео сразу
  directPlayer.src({type: 'video/mp4', src: document.getElementById('directUrl').value});
}

function loadDirect() {
  const url = document.getElementById('directUrl').value.trim();
  if (!url) return alert('Введите ссылку');
  
  directPlayer.src({type: 'video/mp4', src: url});
  directPlayer.play();
}

// Торрент плеер
function loadTorrent() {
  const magnet = document.getElementById('magnetUrl').value.trim();
  const statusBox = document.getElementById('torrentStatus');
  
  if (!magnet) return alert('Введите magnet ссылку');
  
  statusBox.style.display = 'block';
  statusBox.className = 'status-box';
  statusBox.innerHTML = 'Подключение к торренту...';
  
  if (client) client.destroy();
  
  client = new WebTorrent();
  
  client.add(magnet, function(torrent) {
    console.log('Torrent:', torrent);
    
    // Находим видеофайл
    const file = torrent.files.find(f => 
      /\.(mp4|webm|mkv|avi|mov)$/i.test(f.name)
    );
    
    if (!file) {
      statusBox.className = 'status-box error';
      statusBox.innerHTML = '❌ Видеофайл не найден в торренте';
      return;
    }
    
    statusBox.innerHTML = `✅ Найден файл: <b>${file.name}</b><br>Размер: ${(file.length/1024/1024).toFixed(1)} MB`;
    
    // Создаём URL для видео
    file.getBlobURL(function(err, url) {
      if (err) {
        statusBox.className = 'status-box error';
        statusBox.innerHTML += '<br>❌ Ошибка: ' + err.message;
        return;
      }
      
      statusBox.className = 'status-box success';
      statusBox.innerHTML += '<br>✅ Готово к воспроизведению';
      
      if (!torrentPlayer) {
        torrentPlayer = videojs('torrentPlayer');
      }
      
      torrentPlayer.src({type: 'video/mp4', src: url});
      torrentPlayer.play();
    });
    
    // Обновляем статистику
    setInterval(() => {
      const progress = (torrent.progress * 100).toFixed(1);
      const peers = torrent.numPeers;
      const speed = (torrent.downloadSpeed / 1024 / 1024).toFixed(2);
      statusBox.innerHTML += `<div class="torrent-stats">Загрузка: ${progress}% | Пиры: ${peers} | Скорость: ${speed} MB/s</div>`;
    }, 2000);
  });
  
  client.on('error', err => {
    statusBox.className = 'status-box error';
    statusBox.innerHTML = '❌ Ошибка WebTorrent: ' + err.message;
  });
}

function switchTab(tab) {
  document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.source-panel').forEach(p => p.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(tab + 'Panel').classList.add('active');
}

// Старт
initDirectPlayer();
</script>

</body>
</html>
