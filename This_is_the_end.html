<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Апокалипсис по-голливудски — Fish Cinema</title>
<link href="https://archive.org/download/2013-2013-2/2013-2013-2.mp4" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#e8cc80;--gold-dim:#8a7040;--cream:#e8dcc8;--cream-dim:#c4aa88;--bg:#16120c;--bg2:#1e1810;--bg3:#262014;--red:#7a2020;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--cream);min-height:100vh;overflow-x:hidden;}
.page-content{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:50px 50px 60px;}

.section-divider{display:flex;align-items:center;gap:16px;margin:40px 0 24px;}
.section-divider::before,.section-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.section-label{font-family:'Bebas Neue',sans-serif;font-size:0.78rem;letter-spacing:0.3em;color:var(--gold);white-space:nowrap;}

/* Адаптивный iframe плеер */
.archive-player{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border:2px solid var(--gold-dim);background:#000;box-shadow:0 0 0 1px rgba(212,175,55,0.15),0 10px 40px rgba(0,0,0,0.6);}
.archive-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:block;}

/* Декоративные углы */
.player-corners{position:relative;}
.player-corners::before,.player-corners::after{content:"";position:absolute;width:20px;height:20px;border-color:var(--gold);border-style:solid;z-index:10;pointer-events:none;}
.player-corners::before{top:2px;left:2px;border-width:2px 0 0 2px;}
.player-corners::after{top:2px;right:2px;border-width:2px 2px 0 0;}
.player-corners-inner{position:relative;}
.player-corners-inner::before,.player-corners-inner::after{content:"";position:absolute;width:20px;height:20px;border-color:var(--gold);border-style:solid;z-index:10;pointer-events:none;}
.player-corners-inner::before{bottom:2px;left:2px;border-width:0 0 2px 2px;}
.player-corners-inner::after{bottom:2px;right:2px;border-width:0 2px 2px 0;}

/* Инфо под плеером */
.player-meta{margin-top:15px;display:flex;justify-content:space-between;align-items:center;font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.15em;color:var(--gold-dim);}
.player-meta a{color:var(--gold);text-decoration:none;}
.player-meta a:hover{color:var(--gold-light);}

/* Альтернативные источники */
.alt-sources{margin-top:30px;padding:20px;background:rgba(30,24,16,0.5);border:1px solid rgba(180,150,80,0.1);border-radius:3px;}
.alt-sources h4{font-family:'Playfair Display',serif;color:var(--gold);margin-bottom:15px;font-size:1.1rem;}
.source-btn{display:inline-block;background:rgba(201,168,76,0.1);border:1px solid var(--gold-dim);color:var(--cream);padding:8px 16px;margin:5px;text-decoration:none;font-family:'Bebas Neue',sans-serif;font-size:0.8rem;letter-spacing:0.1em;transition:0.2s;}
.source-btn:hover{background:var(--gold);color:var(--bg);border-color:var(--gold);}

/* Прочие стили страницы */
.filmstrip{width:100%;height:34px;background:var(--bg2);display:flex;align-items:center;overflow:hidden;border-bottom:2px solid #1a1208;}
.filmstrip-holes{display:flex;align-items:center;animation:strip-scroll 14s linear infinite;white-space:nowrap;}
.filmstrip-hole{width:19px;height:13px;border:2px solid #2a2010;border-radius:3px;margin:0 15px;flex-shrink:0;background:#060402;}
@keyframes strip-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.top-nav{background:var(--bg2);border-bottom:2px solid var(--gold-dim);display:flex;align-items:center;padding:0;position:sticky;top:0;z-index:200;}
.back-btn{font-family:'Bebas Neue',sans-serif;font-size:0.85rem;letter-spacing:0.18em;color:var(--cream-dim);background:none;border:none;border-right:1px solid var(--gold-dim);padding:14px 24px;text-decoration:none;transition:0.2s;}
.back-btn:hover{color:var(--gold);}
.nav-title{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold);font-size:1rem;padding:14px 24px;}
.nav-spacer{flex:1;}
.nav-meta{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.2em;color:var(--gold-dim);padding:14px 24px;border-left:1px solid rgba(212,175,55,0.15);}

.hero{position:relative;min-height:420px;display:flex;align-items:flex-end;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center top;filter:sepia(40%) brightness(0.35) contrast(1.1);}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,5,0.2) 0%,rgba(10,7,5,0.98) 100%);}
.hero-content{position:relative;z-index:2;padding:40px 50px;display:flex;gap:40px;align-items:flex-end;width:100%;}
.poster-wrap{flex-shrink:0;}
.poster-wrap img{width:200px;border:3px solid var(--gold-dim);box-shadow:0 0 0 1px rgba(212,175,55,0.2),-8px 8px 40px rgba(0,0,0,0.8);}
.hero-info{flex:1;}
.hero-title{font-family:'Playfair Display',serif;font-size:2.5rem;font-weight:900;font-style:italic;color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,0.4);}
.hero-orig{color:var(--cream-dim);font-style:italic;margin:10px 0;}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0;}
.meta-tag{font-family:'Bebas Neue',sans-serif;font-size:0.75rem;letter-spacing:0.12em;padding:4px 12px;border:1px solid var(--gold-dim);color:var(--gold);background:rgba(201,168,76,0.08);}
</style>
</head>
<body>

<div class="filmstrip"><div class="filmstrip-holes" id="filmstripTop"></div></div>

<section class="hero">
  <div class="hero-bg" style="background-image:url('https://play-lh.googleusercontent.com/AoLjRe-KKJqd8ogN33AhIdbpQTOQFvaUDZjIkuf5v0LaPGdKv4N--FX97XkDpuWA4i9V')"></div>
  <div class="hero-gradient"></div>
  <div class="hero-content">
    <div class="poster-wrap">
      <img src="https://play-lh.googleusercontent.com/AoLjRe-KKJqd8ogN33AhIdbpQTOQFvaUDZjIkuf5v0LaPGdKv4N--FX97XkDpuWA4i9V" alt="Постер">

    <div class="hero-info">
      <h1 class="hero-title">Апокалипсис по-голливудски</h1>
      <div class="hero-orig">This Is the End · 2013</div>
      <div class="hero-meta">
        <span class="meta-tag">Комедия</span>
        <span class="meta-tag">США</span>
        <span class="meta-tag">107 мин</span>
      </div>
    </div>
  </div>
</section>

<div class="page-content">
  <div class="section-divider"><span class="section-label">✦ Смотреть онлайн ✦</span></div>
  
  <!-- Плеер Archive.org -->
  <div class="player-corners">
    <div class="player-corners-inner">
      <div class="archive-player">
        <iframe src="https://archive.org/embed/2013-2013-2" 
                width="100%" height="100%"

  <div class="player-meta">
    <span>Видео загружено на Archive.org</span>
    <a href="https://archive.org/details/2013-2013-2" target="_blank">Открыть на Archive.org ↗</a>

  <!-- Альтернативные источники -->
  <div class="alt-sources">
    <h4>⚠ Не работает видео?</h4>

    <a href="https://archive.org/download/2013-2013-2/2013-2013-2.mp4" class="source-btn" target="_blank">Прямая ссылка MP4</a>
    <a href="https://archive.org/stream/2013-2013-2/2013-2013-2.mp4" class="source-btn" target="_blank">Stream версия</a>
  </div>
</div>

<script>

</body>
</html>
